name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Single Module
        run: |
          set -euo pipefail
          PROJECT_OUTPUT="$(./gradlew projects --console=plain)"
          printf '%s\n' "$PROJECT_OUTPUT"
          PROJECT_LINES="$(printf '%s\n' "$PROJECT_OUTPUT" | grep -o "Project ':[^']*'" || true)"
          test "$PROJECT_LINES" = "Project ':app'"

      - name: Clean
        run: ./gradlew clean
      
      - name: Assemble Debug
        run: ./gradlew :app:assembleDebug
        
      - name: Run JVM Unit Tests
        run: ./gradlew :app:testDebugUnitTest
        
      - name: Run Lint
        run: ./gradlew :app:lintDebug
        
      - name: Assemble Release
        run: ./gradlew :app:assembleRelease
        
      - name: Compile Android Tests
        run: ./gradlew :app:compileDebugAndroidTestKotlin
        
      - name: Assemble Android Test APK
        run: ./gradlew :app:assembleDebugAndroidTest

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
